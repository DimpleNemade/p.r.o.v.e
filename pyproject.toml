[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["apps/api"]
testpaths = ["apps/api", "services/forensic-worker/tests"]
# Collect the per-app `tests.py` modules as well as `test_*.py`, so `pytest`
# and `manage.py test` discover the same suite.
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "I001", "E701", "F401", "F403", "F405"]
